name: Security checks
on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: '30 5 * * *'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  dependency-and-runtime:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Dependency audit
        run: |
          mkdir -p validation
          npm audit --json > validation/npm-audit.json
      - name: Runtime lifecycle check
        if: always()
        run: node scripts/security-runtime-check.mjs
      - name: Retain evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: security-evidence
          path: validation/
          retention-days: 90
  source-and-config:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Scan dependencies, secrets and configuration
        uses: aquasecurity/trivy-action@0.35.0
        with:
          scan-type: fs
          scan-ref: .
          skip-dirs: node_modules,.next,.git,validation
          scanners: vuln,secret,misconfig
          severity: HIGH,CRITICAL
          exit-code: '1'
          hide-progress: true
