name: Security checks
on:
  pull_request:
  push:
    branches: [main, "codex/security-*"]
  schedule:
    - cron: '30 5 * * *'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  dependency-and-runtime:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Dependency audit
        run: |
          mkdir -p validation
          npm audit --json > validation/npm-audit.json
      - name: Runtime lifecycle check
        if: always()
        run: node scripts/security-runtime-check.mjs
      - name: Retain evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: security-evidence
          path: validation/
          retention-days: 90
  source-and-config:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Scan dependencies, secrets and configuration
        uses: aquasecurity/trivy-action@57a97c7e7821a5776cebc9bb87c984fa69cba8f1 # v0.35.0
        with:
          scan-type: fs
          scan-ref: .
          skip-dirs: node_modules,.next,.git,validation
          scanners: vuln,secret,misconfig
          severity: HIGH,CRITICAL
          exit-code: '1'
          hide-progress: true

  python-dependencies:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install pip-audit
      - name: Audit locked companion-service dependencies
        run: |
          mkdir -p validation
          pip-audit -r bot/requirements.lock --disable-pip --no-deps -f json -o validation/bot-audit.json
      - name: Retain evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: python-security-evidence
          path: validation/bot-audit.json
          retention-days: 90
